[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-opendata-mcp"
version = "1.0.0"
description = "Local MCP server: NYC Open Data and DOT ArcGIS (PRISM, GAZETTEER) for make-safe-batch SRs"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10", "pyproj>=3.4", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nyc-opendata-mcp = "nycod.server:main"
nycod-brief = "nycod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
