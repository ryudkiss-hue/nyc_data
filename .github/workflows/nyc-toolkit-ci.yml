# Primary CI for NYC DOT Socrata Toolkit (Turbo-Stream Dash + analyst CLI).

name: NYC Toolkit CI

on:
  push:
    branches: [main, master, "claude/*"]
  pull_request:
    branches: [main, master]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11 (datetime.UTC); 3.12 is the next supported minor.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[xlsx,postgres,mission]"
          pip install -r requirements-dev.txt
          pip install networkx scikit-learn fastapi httpx

      - name: Ruff
        run: ruff check src/socrata_toolkit tests app scripts

      - name: Run tests (core)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pytest tests/ --ignore=tests/browser -q --tb=short \
            --cov=src/socrata_toolkit/analyst --cov=src/socrata_toolkit/core \
            --cov-report=term-missing

      - name: Import smoke (analyst + shims)
        run: |
          python -c "
          import importlib
          mods = [
              'socrata_toolkit.core.cli',
              'socrata_toolkit.analyst.workflow',
              'socrata_toolkit.analysis.advanced',
              'socrata_toolkit.analysis.program',
              'socrata_toolkit.nlp.advanced',
          ]
          for m in mods:
              importlib.import_module(m)
          print('import smoke ok')
          "

      - name: Dash app module smoke test
        env:
          MISSION_DEMO: "1"
          NYC_FORCE_LOCAL: "1"
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import sys, os
          os.environ.setdefault('DUCKDB_PATH', '/tmp/empty_test.duckdb')
          mods = [
              'app.viz_engine',
              'app.dash_layouts',
              'app.components.filter_system',
              'app.components.metric_cards',
              'app.callbacks.copilot',
              'app.callbacks.sql_callbacks',
          ]
          import importlib
          errs = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  errs.append(f'{m}: {e}')
          if errs:
              for err in errs:
                  print('FAIL:', err, file=sys.stderr)
              sys.exit(1)
          print('Dash module smoke: all imports OK')
          "

      - name: Streamlit app import
        env:
          MISSION_DEMO: "1"
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -c "from app import analytics, data_loader; print('streamlit app ok', data_loader.demo_mode_enabled())"

  browser-tests:
    name: Browser Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[xlsx,postgres,mission]"
          pip install -r requirements-dev.txt
          pip install networkx scikit-learn fastapi httpx
          pip install playwright pytest-playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run browser smoke tests
        env:
          DUCKDB_PATH: /tmp/empty_test.duckdb
          NYC_FORCE_LOCAL: "1"
          MISSION_DEMO: "1"
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/browser/ -m browser -v --tb=short

      - name: Dump Dash server log on failure
        if: failure()
        run: |
          echo "===== dash_test_server.log (server-side tracebacks) ====="
          cat "${TMPDIR:-/tmp}/dash_test_server.log" || true

  # Integration tests against real Postgres + MongoDB service containers. They exercise the
  # data-store seams the unit suite mocks out (auth, SQL, drivers).
  integration:
    name: Integration (Postgres + MongoDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toolkit
          POSTGRES_PASSWORD: toolkit
          POSTGRES_DB: toolkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toolkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[mission,postgres]" pytest
      - run: pip install -r requirements-dev.txt pymongo
      - name: Run integration tests
        run: |
          pytest tests/test_integration_datastores.py \
                 tests/test_integration_scaffold.py -q --tb=short
        env:
          RUN_INTEGRATION: "1"
          PG_DSN: "postgresql://toolkit:toolkit@localhost:5432/toolkit_test"
          MONGO_URI: "mongodb://localhost:27017"

  readiness:
    name: Readiness report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install toolkit
        run: |
          python -m pip install -U pip
          pip install -e ".[xlsx,mission]"
      - name: socrata readiness
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m socrata_toolkit.core.cli readiness

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build toolkit image (mission target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: mission
          push: false
          tags: nyc-dot-sim-toolkit:latest
          cache-from: type=gha
          # ignore-error: transient GHA cache-backend write failures ("error
          # writing layer blob: not_found") must not fail a build that succeeded
          cache-to: type=gha,mode=max,ignore-error=true
