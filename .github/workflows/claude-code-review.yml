name: Claude Code Review on PR

on:
  pull_request:
    types: [opened]
    paths:
      - 'nyc-opendata-mcp/**'
      - 'site/**'

jobs:
  suggest-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment with code-review instructions
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Claude Code review\n\nRun a review of this PR with:\n\n\`\`\`bash\nclaude /code-review ${context.issue.number}\n\`\`\`\n\nIt checks for correctness bugs, simplifications and query mistakes (SoQL and ArcGIS where clauses), and posts findings as inline comments. CI already runs ruff, pytest, the JS/Python parity test and a headless-browser smoke test of every page.`
            })
