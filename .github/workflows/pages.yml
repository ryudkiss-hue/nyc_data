name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs, as in GitHub's starter workflow: deploying in a separate job after the upload has finished
# avoids "No artifacts named github-pages were found", which hit this workflow when both steps ran in one job.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Pages content (site/ without tests or npm files)
        run: |
          mkdir -p _site
          rsync -a --exclude tests --exclude node_modules --exclude 'package*.json' site/ _site/
          ls -R _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
