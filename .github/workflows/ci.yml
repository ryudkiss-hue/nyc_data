name: CI

# Everything reads the live NYC Open Data and DOT ArcGIS services; nothing is mocked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: MCP server (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "nyc-opendata-mcp[test]" ruff
      - name: Lint
        run: ruff check nyc-opendata-mcp site/tests
      - name: Test (live; msb.py parity tests skip without MSB_REFERENCE)
        run: pytest nyc-opendata-mcp/tests -q

  site:
    name: Site (syntax, JS/Python parity, browser smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e nyc-opendata-mcp playwright openpyxl
          cd site && npm ci
      - name: Syntax check
        run: cd site && npm run check
      - name: Make Safe brief parity (browser port vs Python package)
        run: |
          python site/tests/make_py_briefs.py
          cd site && npm run parity
      - name: Browser smoke test (every page, headless Chrome)
        run: python site/tests/browser_smoke.py
        env:
          CHROME: /usr/bin/google-chrome
          SMOKE_OUT: ${{ runner.temp }}
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke_*.png
          if-no-files-found: ignore
