# Lint settings for nyc-opendata-mcp and site/tests (carried over from the pre-simplify project config).
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines: query strings and docstrings read better unwrapped
    "E731",   # small lambdas as local helpers
    "B905",   # zip() without strict=
]
